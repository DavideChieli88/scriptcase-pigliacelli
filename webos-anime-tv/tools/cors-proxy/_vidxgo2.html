<style>
.ep-selector{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9999;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ep-selector.open{display:block}
.ep-sticky{position:sticky;top:0;z-index:3;background:#0a0a0a}
.ep-head{padding:15px 20px;padding-top:max(15px,env(safe-area-inset-top,0));display:flex;align-items:center;gap:15px;border-bottom:1px solid rgba(255,255,255,.1)}
.ep-show-title{flex:1;color:#fff;font-size:18px;margin:0;font-weight:600}
.ep-close{background:none;border:none;color:#888;font-size:28px;cursor:pointer;line-height:1;padding:0 6px}
.ep-close:hover{color:#fff}
.ep-seasons-wrap{position:relative;display:flex;align-items:stretch;border-bottom:1px solid rgba(255,255,255,.1)}
.ep-seasons{display:flex;gap:0;padding:0 20px;overflow-x:auto;flex:1;scrollbar-width:none}
.ep-seasons::-webkit-scrollbar{display:none}
.ep-season-arrow{display:none;align-items:center;justify-content:center;background:rgba(20,20,20,.95);border:none;color:#fff;font-size:20px;padding:0 14px;cursor:pointer;flex-shrink:0;z-index:2}
.ep-season-arrow:hover{background:rgba(40,40,40,.95)}
.ep-season-arrow.visible{display:flex}
.ep-season-tab{padding:10px 16px;background:none;border:none;border-bottom:2px solid transparent;color:#888;cursor:pointer;font-size:13px;white-space:nowrap;font-weight:500;letter-spacing:.4px}
.ep-season-tab:hover{color:#fff}
.ep-season-tab.active{color:#fff;border-bottom-color:#e50914}
.ep-list{padding:10px 15px;display:flex;flex-direction:column;gap:2px}
.ep-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:6px;cursor:pointer;transition:background .15s;position:relative;overflow:hidden;text-decoration:none;color:inherit}
.ep-item::before{content:'';position:absolute;inset:0 auto 0 0;width:var(--progress,0%);background:rgba(229,9,20,.15);transition:width .3s linear;pointer-events:none;z-index:0}
.ep-item>*{position:relative;z-index:1}
.ep-item:hover{background:rgba(255,255,255,.08)}
.ep-item.playing{border-left:3px solid #e50914;padding-left:7px}
.ep-item.playing .ep-num{color:#e50914}
.ep-thumb{width:120px;height:68px;border-radius:4px;object-fit:cover;flex-shrink:0;background:#1a1a1a}
.ep-thumb.empty{background:linear-gradient(135deg,#1a1a1a,#0d0d0d)}
.ep-loading{padding:40px 20px;text-align:center;color:#888;font-size:13px}
.ep-num{color:#555;font-size:20px;font-weight:700;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.ep-info{flex:1;min-width:0}
.ep-name{color:#fff;font-size:14px;margin-bottom:2px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-plot{color:#888;font-size:11px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-runtime{color:#666;font-size:11px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.ep-btn-top{background:transparent;border:none;color:#fff;cursor:pointer;padding:8px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;line-height:1;gap:2px}
.ep-btn-top:hover{background:rgba(255,255,255,.1)}
.ep-btn-top svg{width:34px;height:34px;fill:currentColor;flex-shrink:0}
.ep-btn-badge{font-size:16px;font-weight:600;margin-left:0;line-height:34px;height:34px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.3px;display:inline-flex;align-items:center;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.ep-btn-name{color:rgba(255,255,255,.7);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:600px){.ep-btn-name{display:none}.ep-btn-badge{max-width:80px}}
@media (max-width:600px){
  .ep-thumb{width:88px;height:50px}
  .ep-name{font-size:12.5px}
  .ep-plot{font-size:10px;-webkit-line-clamp:1}
  .ep-num{font-size:16px;min-width:24px}
  .ep-item{gap:8px;padding:8px}
